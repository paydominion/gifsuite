# Tests every change, then deploys to Cloudflare from GitHub's servers (fast network, Docker built in),
# so deploys never depend on your Mac.
#   push to main        → tests → staging.gifsuite.com
#   pull request        → tests only
#   "Run workflow" button → tests → staging or production (you choose)
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# Never run two deploys to the same place at once; queue them instead.
concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm versions disagree about optional packages in the lock file, so use the one
      # recorded in package.json ("packageManager") everywhere.
      - name: Use the project's npm version
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Install ffmpeg and WebP tools (used by the media processor in tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg webp
      - run: npm ci
      - name: Secret scan, types, lint, unit, API and browser tests, bundle leak check
        run: npm run check:all
      - name: Keep test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub environments: add "Required reviewers" to production in the repo settings
    # if you want to approve each production deploy.
    environment:
      name: ${{ github.event.inputs.target || 'staging' }}
      url: ${{ (github.event.inputs.target || 'staging') == 'production' && 'https://gifsuite.com' || 'https://staging.gifsuite.com' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 20b8ba24d09e2641751595eb779909f1
      WRANGLER_SEND_METRICS: "false"
      # wrangler.jsonc: production is the top level, staging is `--env staging`.
      ENV_FLAG: ${{ (github.event.inputs.target || 'staging') == 'staging' && '--env staging' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm versions disagree about optional packages in the lock file, so use the one
      # recorded in package.json ("packageManager") everywhere.
      - name: Use the project's npm version
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
      - name: Apply database migrations
        timeout-minutes: 5
        run: npx wrangler d1 migrations apply DB --remote $ENV_FLAG
      - name: Deploy (builds and uploads the media processor container)
        timeout-minutes: 20
        run: npx wrangler deploy $ENV_FLAG
