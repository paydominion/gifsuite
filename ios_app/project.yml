name: GifSuite
options:
  bundleIdPrefix: com.gifsuite
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_API_BASE_URL: https://staging.gifsuite.com
targets:
  GifSuite:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gifsuite.ios
        PRODUCT_NAME: GifSuite
        INFOPLIST_KEY_CFBundleDisplayName: GifSuite
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
